<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOF Admin | Login</title>
    <link rel="stylesheet" href="../static/root.css">
</head>
    <div class="auth-container">
        
        <div class="visual-side">
            <img src="../icons/logo-light(1).png" alt="JOF Logo" class="brand-logo-img">
            <p class="brand-quote">
                Get the best workouts &amp; excercise plans tailored for you at JOF Fitness Center!
            </p>
        </div>

        <div class="form-side">
            
            <div id="loginForm">
                <div class="form-header">
                    <h2>Welcome Back! 👋</h2>
                    <p>Enter your details to access the admin panel.</p>
                </div>

                <div id="formMessage" class="form-message" style="display:none;"></div>

                <form id="formLogin" action="../auth/login.php" method="POST">
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" name="email" class="form-input" placeholder="Email Address" required>
                            <img src="../icons/envelope-solid-full.svg" class="input-icon" alt="email">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                            <img src="../icons/lock-solid-full.svg" class="input-icon" alt="lock">
                        </div>
                    </div>

                    <div class="actions">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                       <a href="forgot_password.php" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <div class="switch-form">
                    Don't have an account? <a href="registration_page.php">Sign Up</a>
                </div>
            </div>

        </div>
    </div>
    <script>
        const form = document.getElementById('formLogin');
        const msgBox = document.getElementById('formMessage');

        function showMessage(text, type) {
            msgBox.textContent = text;
            msgBox.className = 'form-message ' + type;
            msgBox.style.display = 'block';
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            fetch('../auth/login.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '../templates/dashboard.php';
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(() => {
                showMessage('Server not reachable. Please try again.', 'error');
            });
        });
</script>

</body>
</html>
